name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test and build signed APK
        env:
          KEY_DATA: ${{ secrets.SODA_KEY }}
          SIGN_PASSWORD: ${{ secrets.SODA_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export SIGN_FILE="$RUNNER_TEMP/soda.p12"
          test -n "$KEY_DATA" && test -n "$SIGN_PASSWORD"
          printf '%s' "$KEY_DATA" | base64 -d > "$SIGN_FILE"
          bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
          mkdir -p package
          cp app/build/outputs/apk/release/app-release.apk package/SodaGroove.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose package/SodaGroove.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SodaGroove-APK
          path: package/SodaGroove.apk
          retention-days: 7

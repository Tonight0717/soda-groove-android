<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><style>*{box-sizing:border-box}html,body,#yt{margin:0;width:100%;height:100%;background:#102d38;border:0}</style></head><body>
<div id="yt"></div><script>
const source = __SOURCE__;
let player, ready=false, failure=0, blocked=false;
function onYouTubeIframeAPIReady(){
  const vars={playsinline:1,controls:1,origin:location.origin,rel:0};
  if(source.list){vars.listType='playlist';vars.list=source.list;}
  player=new YT.Player('yt',{width:'100%',height:'100%',videoId:source.video||undefined,playerVars:vars,
    events:{onReady:()=>{ready=true},onError:e=>{failure=e.data},onStateChange:e=>{if(e.data===1){failure=0;blocked=false}},onAutoplayBlocked:()=>{blocked=true}}});
}
function snapshot(){
  if(!ready)return {ready:false,error:failure};
  const data=player.getVideoData()||{};
  return {ready:true,error:failure,blocked,state:player.getPlayerState(),id:data.video_id||'',title:data.title||'',
    seconds:player.getCurrentTime()||0,duration:player.getDuration()||0};
}
function seek(fraction){if(ready && player.getDuration()>0)player.seekTo(player.getDuration()*fraction,true);}
</script><script src="https://www.youtube.com/iframe_api" onerror="failure=-1"></script></body></html>
